<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria Franco Arte AI</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width:1000px;
    margin:40px auto;
    padding:20px;
    background:#f4f4f4;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
    color:#7a5071;
}

label{
    display:block;
    margin-top:20px;
    font-weight:bold;
}

select{
    width:100%;
    padding:10px;
}

.cores{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
}

.cor{
    background:#f5f5f5;
    padding:10px;
    border-radius:6px;
}

.botoes{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.botoes button{
    flex:1;
}

button{
    padding:15px;
    background:#7a5071;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#603d59;
}

#loading{
    display:none;
    margin-top:20px;
    font-weight:bold;
}

#resultado{
    display:none;
    margin-top:20px;
    padding:20px;
    background:#f0f0f0;
    border-radius:8px;
    white-space:pre-wrap;
}

#resultadoImagem{
    display:none;
    margin-top:20px;
    padding:20px;
    background:white;
    border-radius:8px;
    border:1px solid #ddd;
}

#imagemGerada{
    width:100%;
    max-width:800px;
    display:none;
    margin:auto;
    border-radius:8px;
}

#promptImagem{
    margin-top:15px;
    white-space:pre-wrap;
}

</style>
</head>

<body>

<div class="card">

<h1>Maria Franco Arte AI</h1>

<label>Tipo de Vidro</label>
<select id="vidro">
<option>Jarra</option>
<option>Copo</option>
<option>Xícara</option>
<option>Boleira</option>
<option>Queijeira</option>
</select>

<label>Flor Principal</label>
<select id="flor">
<option>Girassol</option>
<option>Lírio</option>
<option>Lavanda</option>
<option>Orquídea</option>
</select>

<label>Montagem</label>
<select id="montagem">
<option>Espaçada</option>
<option>Média</option>
<option>Cheia</option>
</select>

<label>Cores</label>

<div class="cores">

<div class="cor"><input type="checkbox" value="Branco"> Branco</div>
<div class="cor"><input type="checkbox" value="Amarelo"> Amarelo</div>
<div class="cor"><input type="checkbox" value="Laranja"> Laranja</div>
<div class="cor"><input type="checkbox" value="Vermelho"> Vermelho</div>
<div class="cor"><input type="checkbox" value="Rosa"> Rosa</div>
<div class="cor"><input type="checkbox" value="Lilás"> Lilás</div>
<div class="cor"><input type="checkbox" value="Roxo"> Roxo</div>
<div class="cor"><input type="checkbox" value="Azul"> Azul</div>
<div class="cor"><input type="checkbox" value="Verde"> Verde</div>
<div class="cor"><input type="checkbox" value="Marrom"> Marrom</div>

</div>

<div class="botoes">

<button id="btnGerarTexto">
Gerar Ideia com IA
</button>

<button id="btnGerarImagem">
Gerar Imagem com IA
</button>

</div>

<div id="loading">
Consultando IA...
</div>

<div id="resultado"></div>

<div id="resultadoImagem">

<h2>Visualização da Peça</h2>

<img
id="imagemGerada"
alt="Imagem Gerada">

<div id="promptImagem"></div>

</div>

</div>

<script>

const WORKER_URL =
"https://maria-franco-ai-worker.mmt-franco.workers.dev";

function obterDadosFormulario(){

    return {

        vidro:
            document.getElementById("vidro").value,

        flor:
            document.getElementById("flor").value,

        montagem:
            document.getElementById("montagem").value,

        cores:
            Array.from(
                document.querySelectorAll(
                    'input[type="checkbox"]:checked'
                )
            ).map(c => c.value)

    };

}

// ===========================================
// TEXTO
// ===========================================

document
.getElementById("btnGerarTexto")
.addEventListener("click", async function(){

    const dados =
        obterDadosFormulario();

    const prompt = `
Crie uma proposta criativa de pintura artesanal em vidro.

Tipo de peça:
${dados.vidro}

Flor principal:
${dados.flor}

Montagem:
${dados.montagem}

Paleta:
${dados.cores.join(", ")}

Descreva detalhadamente como ficaria a pintura.
`;

    document.getElementById("loading").style.display =
        "block";

    try {

        const response =
            await fetch(
                WORKER_URL + "/generate-text",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        prompt
                    })
                }
            );

        const data =
            await response.json();

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("resultado").style.display =
            "block";

        document.getElementById("resultado").innerText =
            data.resposta;

    }
    catch(err){

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("resultado").style.display =
            "block";

        document.getElementById("resultado").innerText =
            err.message;

    }

});

// ===========================================
// IMAGEM
// ===========================================

document
.getElementById("btnGerarImagem")
.addEventListener("click", async function(){

    const dados =
        obterDadosFormulario();

    document.getElementById("loading").style.display =
        "block";

    document.getElementById("resultadoImagem").style.display =
        "none";

    try {

        const response =
            await fetch(
                WORKER_URL + "/generate-image",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify(dados)
                }
            );

        const data =
            await response.json();

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("resultadoImagem").style.display =
            "block";

        if(data.sucesso && data.imageUrl){

            document.getElementById("imagemGerada").style.display =
                "block";

            document.getElementById("imagemGerada").src =
                data.imageUrl;

            document.getElementById("promptImagem").innerText =
                "";

        }
        else{

            document.getElementById("promptImagem").innerText =
                JSON.stringify(data,null,2);

        }

    }
    catch(err){

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("resultadoImagem").style.display =
            "block";

        document.getElementById("promptImagem").innerText =
            err.message;

    }

});

</script>

</body>
</html>
