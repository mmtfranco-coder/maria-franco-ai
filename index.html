<html lang="pt-BR">

.card{
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.10);
}

}

button{

    background:#7a5071;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#603d59;
}

#resultado{
    margin-top:25px;

}

pre{
    white-space:pre-wrap;
    word-break:break-word;
}

</style>

</head>

Gerador de ideias para pintura em vidro.

</select>

<label>Cores (até 5)</label>

<button onclick="gerarIdeia()">

<div id="resultado"></div>

</div>
