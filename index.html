<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maria Franco Arte - Gerador de Ideias</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
    background-color: #fafafa;
}

.card{
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.10);
}

h1{
    color: #7a5071;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

select{
    width:100%;
    padding:10px;
    margin-top:5px;
}

.cores{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-top:10px;
}

.cor-item{
    background:#f5f5f5;
    padding:8px;
    border-radius:5px;
}

button{
    margin-top:25px;
    background:#7a5071;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#603d59;
}

#resultado{
    margin-top:25px;
    padding:20px;
    border-radius:8px;
    background:#f5f5f5;
    display:none;
}

pre{
    white-space:pre-wrap;
}

</style>
</head>
<body>

<div class="card">

<h1>Maria Franco Arte</h1>

<p>
Gerador de ideias para pintura em vidro e cristal.
</p>

<label>Tipo de Vidro</label>
<select id="vidro">
    <option value="Jarra">Jarra</option>
    <option value="Copo">Copo</option>
    <option value="Xícara">Xícara</option>
    <option value="Boleira">Boleira</option>
    <option value="Queijeira">Queijeira</option>
</select>

<label>Flor Principal</label>
<select id="flor">
    <option value="Girassol">Girassol</option>
    <option value="Lírio">Lírio</option>
    <option value="Lavanda">Lavanda</option>
    <option value="Orquídea">Orquídea</option>
</select>

<label>Montagem</label>
<select id="montagem">
    <option value="Espaçada">Espaçada</option>
    <option value="Média">Média</option>
    <option value="Cheia">Cheia</option>
</select>

<label>Cores (selecione até 5)</label>

<div class="cores">

<label class="cor-item"><input type="checkbox" value="Amarelo"> Amarelo</label>
<label class="cor-item"><input type="checkbox" value="Laranja"> Laranja</label>
<label class="cor-item"><input type="checkbox" value="Vermelho"> Vermelho</label>
