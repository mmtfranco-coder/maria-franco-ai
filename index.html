<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria Franco Arte AI</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width:1000px;
    margin:40px auto;
    padding:20px;
    background:#f4f4f4;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
    color:#7a5071;
}

label{
    display:block;
    margin-top:20px;
    font-weight:bold;
}

select{
    width:100%;
    padding:10px;
}

.cores{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
}

.cor{
    background:#f5f5f5;
    padding:10px;
    border-radius:6px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    background:#7a5071;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#603d59;
}

#loading{
    display:none;
    margin-top:20px;
}

#resultado{
    display:none;
    margin-top:20px;
    padding:20px;
    background:#f0f0f0;
    border-radius:8px;
    white-space:pre-wrap;
}

</style>
</head>

<body>

<div class="card">

<h1>Maria Franco Arte AI</h1>

<label>Tipo de Vidro</label>
<select id="vidro">
<option>Jarra</option>
<option>Copo</option
