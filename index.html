<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria Franco Arte AI</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:40px;
}

.card{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
    color:#7b5678;
}

label{
    display:block;
    margin-top:20px;
    font-weight:bold;
}

select{
    width:100%;
    padding:10px;
    margin-top:5px;
}

button{
    margin-top:25px;
    padding:12px 20px;
    border:none;
    border-radius:6px;
    background:#7b5678;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#654563;
}

#resultado{
    margin-top:30px;
    padding:20px;
    background:#f0f0f0;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="card">

<h1>Maria Franco Arte AI</h1>

<label>Tipo de Vidro</label>
<select id="vidro"></select>

<label>Flor Principal</label>
<select id="flor"></select>

<label>Montagem</label>
<select id="montagem"></select>

<label>Cores (CTRL + clique para selecionar várias)</label>
<select id="cores" multiple size="8"></select>

<button onclick="gerarIdeia()">Gerar Ideia</button>

<div id="resultado">
Selecione as opções e clique em "Gerar Ideia".
</div>

</div>

<script>

fetch('database.json')
.then(response => response.json())
.then(data => {

    preencher('vidro', data.vidros);
    preencher('flor', data.flores);
    preencher('montagem', data.montagens);
    preencher('cores', data.cores);

});

function preencher(id, lista){

    const select = document.getElementById(id);

    lista.forEach(item => {

        const option = document.createElement('option');

        option.value = item.id;
        option.textContent = item.nome;

        select.appendChild(option);

    });

}

function gerarIdeia(){

    const vidro =
        document.getElementById('vidro').selectedOptions[0].text;

    const flor =
        document.getElementById('flor').selectedOptions[0].text;

    const montagem =
        document.getElementById('montagem').selectedOptions[0].text;

    const cores =
        Array.from(
            document.getElementById('cores').selectedOptions
        )
        .map(item => item.text);

    document.getElementById('resultado').innerHTML = `
        <h3>Sugestão Selecionada</h3>

        <p><strong>Vidro:</strong> ${vidro}</p>

        <p><strong>Flor:</strong> ${flor}</p>

        <p><strong>Montagem:</strong> ${montagem}</p>

        <p><strong>Cores:</strong> ${cores.join(', ')}</p>
    `;

}

</script>

</body>
</html>
