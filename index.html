<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maria Franco Arte - Gerador de Ideias</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
    background: #f5f5f5;
}

.card{
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.08);
}

h1{
    color:#7a5071;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-size:18px;
    font-weight:bold;
}

select{
    width:100%;
    padding:12px;
    font-size:16px;
}

.cores-container{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.cor{
    background:#f0f0f0;
    border-radius:6px;
    padding:10px;
}

button{
    margin-top:25px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:8px;
    background:#7a5071;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#633f5b;
}

#resultado{
    margin-top:30px;
    padding:20px;
    border-radius:8px;
    background:#f4f4f4;
    display:none;
}

pre{
    white-space:pre-wrap;
    font-size:15px;
}

</style>
</head>

<body>

<div class="card">

<h1>Maria Franco Arte</h1>

<p>
Gerador de ideias para pintura em vidro e cristal.
</p>

<label>Tipo de Vidro</label>

<select id="vidro">
    <option>Jarra</option>
    <option>Copo</option>
    <option>Xícara</option>
    <option>Boleira</option>
    <option>Queijeira</option>
</select>

<label>Flor Principal</label>

<select id="flor">
    <option>Girassol</option>
    <option>Lírio</option>
    <option>Lavanda</option>
    <option>Orquídea</option>
</select>

<label>Montagem</label>

<select id="montagem">
    <option>Espaçada</option>
    <option>Média</option>
    <option>Cheia</option>
</select>

<label>Cores (até 5)</label>

<div class="cores-container">

<div class="cor">
<input type="checkbox" value="Branco"> Branco
</div>

<div class="cor">
<input type="checkbox" value="Amarelo"> Amarelo
</div>

<div class="cor">
<input type="checkbox" value="Laranja"> Laranja
</div>

<div class="cor">
<input type="checkbox" value="Vermelho"> Vermelho
</div>

<div class="cor">
<input type="checkbox" value="Rosa"> Rosa
</div>

<div class="cor">
<input type="checkbox" value="Lilás"> Lilás
</div>

<div class="cor">
<input type="checkbox" value="Roxo"> Roxo
</div>

<div class="cor">
<input type="checkbox" value="Azul"> Azul
</div>

<div class="cor">
<input type="checkbox" value="Verde"> Verde
</div>

<div class="cor">
<input type="checkbox" value="Marrom"> Marrom
</div>

</div>

<button id="btnGerar">
Gerar Ideia
</button>

<div id="resultado"></div>

</div>

<script>

document.getElementById("btnGerar")
.addEventListener("click", function(){

    const vidro =
        document.getElementById("vidro").value;

    const flor =
        document.getElementById("flor").value;

    const montagem =
        document.getElementById("montagem").value;

    const coresSelecionadas =
        Array.from(
            document.querySelectorAll(
                'input[type="checkbox"]:checked'
            )
        );

    if(coresSelecionadas.length === 0){

        alert("Selecione pelo menos uma cor.");

        return;
    }

    if(coresSelecionadas.length > 5){

        alert("Selecione no máximo 5 cores.");

        return;
    }

    const cores =
        coresSelecionadas.map(
            item => item.value
        );

    const prompt = `
Crie uma proposta original de pintura artesanal em vidro.

Tipo de vidro:
${vidro}

Flor principal:
${flor}

Montagem:
${montagem}

Paleta de cores:
${cores.join(", ")}

A composição deve ser elegante, harmoniosa e adequada para pintura manual em vidro e cristal.

A proposta deve servir como inspiração para artistas do universo Maria Franco Arte.
`;

    const resultado =
        document.getElementById("resultado");

    resultado.style.display = "block";

    resultado.innerHTML =
        "<h2>Prompt Gerado</h2><pre>" +
        prompt +
        "</pre>";

});

</script>

</body>
</html>
